name: CI Financial Pipeline Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    name: Run Automated Financial Tests & Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync

      - name: Run Core Financial Analytics Pipeline
        run: |
          PYTHONPATH=src uv run python src/pipeline_runner.py

      - name: Run Financial Data Validator
        run: |
          PYTHONPATH=src uv run python src/validator.py

[project]
name = "phantichtcdn"
version = "0.1.0"
description = "Financial Intelligence & Quantitative Analysis Platform for Vietnam Airlines (HVN)"
authors = [
    { name = "Nguyen Trung Hieu", email = "trunghieuwane@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "dspy>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


